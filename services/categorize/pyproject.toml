[project]
name = "categorize"
version = "0.1.0"
description = "Transaction categorization service"
authors = [
    { name = "Sune Engtorp", email = "sune.engtorp@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.1",
    "opentelemetry-distro>=0.62b1",
    "opentelemetry-exporter-otlp>=1.41.1",
    "opentelemetry-instrumentation-fastapi>=0.62b1",
    "opentelemetry-instrumentation-pika>=0.62b1",
    "httpx>=0.28",
    "opentelemetry-instrumentation-httpx>=0.62b1",
    "pika>=1.4.0",
    "uvicorn[standard]>=0.46.0",
]

[build-system]
requires = ["uv_build>=0.11.12,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=9.0.3",
]
